name: Deploy static preview to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, codex/site-preview]
    paths:
      - index.html
      - styles.css
      - script.js
      - privacy.html
      - photo-brief.html
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static preview
        run: |
          mkdir _site
          cp index.html styles.css script.js privacy.html photo-brief.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
