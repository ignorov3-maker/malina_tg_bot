services:
  - type: web
    name: malina-tg-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HOST
        value: 0.0.0.0
      - key: APP_DATA_DIR
        value: /var/data
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_APPROVE_TOKEN
        sync: false
    disk:
      name: malina-data
      mountPath: /var/data
      sizeGB: 1
