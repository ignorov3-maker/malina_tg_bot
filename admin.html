<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админка Шабанова - менеджеры Малины</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --ink: #20242a;
        --muted: #667085;
        --line: #d9e0e7;
        --accent: #d7192f;
        --accent-dark: #a51325;
        --ok: #247a48;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
      }

      main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(28px, 4vw, 42px);
        line-height: 1.1;
      }

      h2 {
        font-size: 20px;
      }

      .muted {
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 16px;
      }

      .panel {
        padding: 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 44px;
        padding: 0 12px;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      button,
      .link-button {
        min-height: 42px;
        padding: 0 14px;
        color: #fff;
        font-weight: 800;
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover,
      .link-button:hover {
        background: var(--accent-dark);
      }

      button.secondary {
        color: var(--ink);
        background: #edf1f5;
      }

      button.secondary:hover {
        background: #dfe6ed;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .token-actions,
      .row-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .status {
        min-height: 24px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 14px;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.error {
        color: var(--accent);
      }

      .stack {
        display: grid;
        gap: 16px;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .manager-card {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 14px;
        background: #fbfcfd;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .manager-card strong {
        display: block;
        margin-bottom: 4px;
      }

      .manager-card code {
        display: inline-block;
        margin-top: 6px;
        color: var(--muted);
        font-family: Consolas, monospace;
      }

      .empty {
        padding: 16px;
        color: var(--muted);
        background: #fbfcfd;
        border: 1px dashed var(--line);
        border-radius: 8px;
      }

      @media (max-width: 820px) {
        header,
        .manager-card {
          grid-template-columns: 1fr;
        }

        header {
          display: grid;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="muted">Malina bot admin</p>
          <h1>Админка Шабанова</h1>
          <p class="muted">Одобрение Telegram-менеджеров после команды /start в боте.</p>
        </div>
        <a class="link-button" href="/" aria-label="Вернуться на сайт">На сайт</a>
      </header>

      <div class="grid">
        <section class="panel">
          <div class="panel-head">
            <h2>Доступ</h2>
          </div>
          <label for="admin-token">ADMIN_APPROVE_TOKEN</label>
          <input id="admin-token" data-admin-token type="password" autocomplete="current-password" placeholder="Вставьте админ-токен">
          <div class="token-actions">
            <button type="button" data-save-token>Сохранить</button>
            <button class="secondary" type="button" data-clear-token>Сбросить</button>
          </div>
          <p class="status" data-status></p>
        </section>

        <div class="stack">
          <section class="panel">
            <div class="panel-head">
              <div>
                <h2>Ожидают одобрения</h2>
                <p class="muted">Менеджер должен сначала написать боту /start.</p>
              </div>
              <button class="secondary" type="button" data-refresh>Обновить</button>
            </div>
            <div class="list" data-pending-list></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <div>
                <h2>Активные менеджеры</h2>
                <p class="muted">Этим людям бот может выдавать диалоги.</p>
              </div>
            </div>
            <div class="list" data-manager-list></div>
          </section>
        </div>
      </div>
    </main>

    <script src="admin.js?v=20260709-admin"></script>
  </body>
</html>
